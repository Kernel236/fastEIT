[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fasteit"
version = "0.7.0a1"
description = "EIT data parsing, preprocessing, and clinical feature extraction for Dräger PulmoVista"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["EIT", "electrical impedance tomography", "mechanical ventilation", "clinical", "ICU"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scikit-image>=0.22",  # watershed lung mask (preprocessing/lung_mask.py)
]

[project.optional-dependencies]
pyeit = [
    "pyeit>=1.0",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "coverage[toml]>=7.3",
    "eitprocessing==1.8.8",  # reference for the equivalence tests (tests/preprocessing)
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mike>=2.1",
]

[project.urls]
Repository = "https://github.com/Kernel236/fastEIT"
Documentation = "https://kernel236.github.io/fastEIT/"

[tool.hatch.build.targets.wheel]
packages = ["src/fasteit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "octave: marks tests requiring Octave/MATLAB for cross-validation",
]

[tool.coverage.run]
source = ["src/fasteit"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
